name: SmartStock AI unattended monitor and research
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run hourly monitoring or daily research'
        required: true
        type: choice
        options:
          - hourly
          - daily
        default: hourly
  schedule:
    # 15-minute attempt. Runner timing is best effort, not guaranteed.
    - cron: '7,22,37,52 * * * *'
    # Daily research, not continuous model training.
    - cron: '41 1 * * *'
permissions:
  contents: write
concurrency:
  group: smartstock-unattended
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: SmartStock_AI_FREE_v9_Mobile_First
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SmartStock_AI_FREE_v9_Mobile_First/requirements.txt
      - name: Install libraries
        run: python -m pip install -r requirements.txt requests
      - name: Collect and analyze (15min monitoring / daily research)
        env:
          JOB_CRON: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$MANUAL_MODE" = "daily" ] || [ "$JOB_CRON" = '41 1 * * *' ]; then
            python archive_collector.py
            python auto_learning.py --mode daily
            # Existing price-learning journal is separate from the crypto-transfer experiment.
            python scheduled_scan.py --horizons 21
          else
            python auto_learning.py --mode hourly
          fi
      - name: Persist status and completed observations
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for dir in SmartStock_AI_FREE_v9_Mobile_First/data SmartStock_AI_FREE_v9_Mobile_First/reports; do
            if [ -d "$dir" ]; then
              git add -A -- "$dir"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Auto record SmartStock observations and research'
            git push
          fi
